# DuSu: the app is this stack; its DATA lives in the shared MongoDB (container `rooted-mongo`, replica set rs0) that RootEd and Yahin also use.
# One database `dusu`, one user scoped to it (shared-services/scripts/create-app-db.sh dusu prod --no-bucket). Nightly dumps + the offsite copy are done by
# shared-services (mongo-backup 21:30 UTC, r2-sync). (The old Postgres was deleted on 2026-11-16 - see CLAUDE.md section 25 for the restore-from-dump rollback.)

services:
  backend:
    build: ./backend
    image: dusu-backend
    env_file:
      - ./backend/.env
    environment:
      # Built from DUSU_MONGO_PASSWORD in the root .env (letters and digits only, so it needs no escaping). `environment` wins over `env_file`, so a stale
      # MONGODB_URI left in backend/.env cannot send the app anywhere else. The app signs in as its own user: readWrite on `dusu` and nothing else.
      MONGODB_URI: mongodb://dusu_prod_app:${DUSU_MONGO_PASSWORD}@rooted-mongo:27017/dusu?replicaSet=rs0&authSource=dusu
    networks: [default, shared]            # default: the published port below; shared: the shared MongoDB
    ports:
      # Host BACKEND_PORT (default 3878) -> the container's fixed internal 8000.
      - "${BACKEND_PORT:-3878}:8000"
    restart: unless-stopped

# dusu.ranabrothers.online (and the legacy dusu.ruralrootcloud.com) are served by the host's own cloudflared (a systemd service, same as this box's other
# tunnels) routing straight to http://localhost:${BACKEND_PORT:-3878} - not a container in this compose file. See cloudflare/TUNNEL.md.

networks:
  shared:
    external: true
    name: rooted-shared-net
