# DEV-ONLY overlay: hot reload + your working tree mounted over the image.
#
# It is deliberately NOT named docker-compose.override.yml. An override file is
# auto-merged by a bare `docker compose up`, which meant the plain command every
# doc gives would silently turn the LIVE deployment (this box serves
# dusu.ruralrootcloud.com through cloudflared) into a dev container running
# whatever is currently in ./backend. Production is the default now; dev is opt-in:
#
#   docker compose up -d --build                              # PRODUCTION (default)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d   # dev
#
services:
  backend:
    volumes:
      - ./backend:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
